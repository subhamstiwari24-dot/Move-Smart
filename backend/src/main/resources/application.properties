spring.application.name=movesmart-backend
server.port=${PORT:8080}

# Logging
logging.level.com.movesmart=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN

# Database: Environment-variable driven with instant zero-config H2 fallback
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:movesmartdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console (accessible at http://localhost:8080/h2-console when using H2 in development)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Token Configuration
movesmart.jwt.secret=${JWT_SECRET:MoveSmartSecureOperationsSecretKey2026UrbanMobilityEnterpriseHMAC256}
movesmart.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# MoveSmart Application & Seeding Controls
movesmart.seeding.enabled=${SEEDING_ENABLED:true}
movesmart.demo-reset.enabled=${DEMO_RESET_ENABLED:true}
movesmart.initial-admin.email=${INITIAL_ADMIN_EMAIL:admin@movesmart.city}
movesmart.initial-admin.password=${INITIAL_ADMIN_PASSWORD:Admin@2026}
movesmart.storage.location=${UPLOAD_DIR:uploads}
movesmart.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app}
