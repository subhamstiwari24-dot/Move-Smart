# ==============================================================================
# MoveSmart Smart Mobility Platform — Production Environment Profile ('prod')
# Activated via: -Dspring.profiles.active=prod OR export SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

# Dynamic Cloud Port (Automatically provided by Render, Railway, AWS ECS, Heroku, etc.)
server.port=${PORT:8080}

# Production PostgreSQL Database Connection
# Accepts standard JDBC URLs: jdbc:postgresql://<host>:<port>/<dbname>
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Production Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate Production Strategy
# 'update' applies non-destructive incremental schema updates without dropping data
# Set to 'validate' if managing migrations externally (e.g. Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Security: Disable H2 console in production
spring.h2.console.enabled=false

# JWT Secret MUST be set in production environment variables (min 32 characters / 256 bits)
movesmart.jwt.secret=${JWT_SECRET}
movesmart.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Production Seeding: FALSE by default. Never seeds mock incidents into real databases.
movesmart.seeding.enabled=${SEEDING_ENABLED:false}

# Demo Reset: FALSE in production. Blocks POST /api/incidents/reset from erasing live data.
movesmart.demo-reset.enabled=${DEMO_RESET_ENABLED:false}

# Initial Admin Bootstrap (only creates admin user if no admin exists in the database)
movesmart.initial-admin.email=${INITIAL_ADMIN_EMAIL:admin@movesmart.city}
movesmart.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}

# Persistent File Storage Directory (supports mounted cloud persistent volume)
movesmart.storage.location=${UPLOAD_DIR:uploads}

# Production CORS: Restricts origins to Vercel production frontend and custom domains
movesmart.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.vercel.app}
